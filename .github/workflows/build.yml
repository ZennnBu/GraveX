name: Build GraveX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Project ZIP
        run: |
          mkdir project
          unzip -q GraveX_Project.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GraveX
        working-directory: project
        run: gradle build

      - name: Upload GraveX JAR
        uses: actions/upload-artifact@v4
        with:
          name: GraveX-Plugin
          path: project/build/libs/*.jar
